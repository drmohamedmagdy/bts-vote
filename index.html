<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Beyond the Scalpel · Vote & ask</title>
<style>
:root{--ground:#0a161d;--panel:#11252e;--line:#24404c;--ink:#eaf6f4;--ink2:#a9c4c4;--scrub:#3cc9b4;--ok:#7bdc8c;--bad:#ff7d78}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:16px}
.k{font:600 12px/1.2 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--scrub)}
h1{font-size:28px;line-height:1.05;margin:0}
.st{font:12px ui-monospace,monospace;color:var(--ink2);display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#556}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(123,220,140,.2)}
.q{font-size:21px;font-weight:700;line-height:1.25}
.ab{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:16px;cursor:pointer}
.ab .L{font:700 15px ui-monospace,monospace;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#0d1d24}
.ab.sel{border-color:var(--scrub);background:rgba(60,201,180,.14)}
.ab.sel .L{background:var(--scrub);color:var(--ground)}
.ab.right{border-color:var(--ok)}
.ab.wrong{opacity:.55}
.wait{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--ink2);line-height:1.5}
.note{font-size:14px;color:var(--ink2);line-height:1.4}
.ok{color:var(--ok);font-weight:600}
.srt{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.si{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.si p{margin:0 0 10px;font-size:16px;line-height:1.35}
.si .bb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.si .bb button{border:1px solid var(--line);border-radius:10px;background:#0d1d24;color:var(--ink);font:600 14px system-ui,sans-serif;padding:10px 6px;cursor:pointer}
.si .bb button.on0{background:#ff7d78;border-color:#ff7d78;color:#1a0706}
.si .bb button.on1{background:var(--scrub);border-color:var(--scrub);color:var(--ground)}
.si.right{border-color:var(--ok)} .si.wrong{border-color:var(--bad)}
.si .res{font-size:13px;margin-top:8px;color:var(--ink2)}
.send{border:0;border-radius:12px;background:var(--scrub);color:var(--ground);font-weight:700;font-size:17px;padding:14px;cursor:pointer}
.send:disabled{opacity:.45}
.ask{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.ask h2{margin:0;font-size:18px}
.ask textarea,.ask input{width:100%;background:#0d1d24;border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:16px;padding:10px 12px}
.ask textarea{min-height:90px;resize:vertical}
.ask button{align-self:flex-start;border:0;border-radius:10px;background:var(--scrub);color:var(--ground);font-weight:700;font-size:16px;padding:12px 20px;cursor:pointer}
.ask button:disabled{opacity:.5}
.ask .cnt{font:12px ui-monospace,monospace;color:var(--ink2);text-align:right}
</style>
</head>
<body>
<main>
  <div class="k">Beyond the Scalpel · Live vote</div>
  <h1>Vote from your phone</h1>
  <div class="st"><span class="dot" id="dot"></span><span id="stx">Connecting…</span></div>
  <div id="app"><div class="wait">Waiting for the speaker…</div></div>
  <section class="ask" dir="auto">
    <h2>Ask the speaker · اسأل المحاضر</h2>
    <textarea id="qTxt" maxlength="280" placeholder="Type your question… اكتب سؤالك هنا"></textarea>
    <div class="cnt"><span id="qN">0</span> / 280</div>
    <input id="qName" maxlength="40" placeholder="Your name (optional) · الاسم (اختياري)">
    <button id="qSend">Send question · إرسال</button>
    <p class="note" id="qMsg">The speaker chooses which questions to show on the screen.</p>
  </section>
  <p class="note">Anonymous. Keep this page open: each question appears here when the speaker reaches it.</p>
</main>
<script>
const TOPIC = "btsc86831fc2a14f8a6", BASE = "https://ntfy.sh/";
const L = "ABCDEF";
let state = null, mine = {}, cid = "";
try { mine = JSON.parse(localStorage.getItem("bts.mine") || "{}"); cid = localStorage.getItem("bts.cid") || ""; } catch (e) {}
if (!cid){ cid = Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem("bts.cid", cid); } catch (e) {} }
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setLive(on, txt){ $("#dot").classList.toggle("on", on); $("#stx").textContent = txt; }
function draw(){
  const app = $("#app");
  if (!state || !state.poll){ app.innerHTML = `<div class="wait">${state && state.title ? "Now on screen: <b>" + esc(state.title) + "</b><br>" : ""}The next question will appear here.</div>`; return; }
  const p = state.poll, key = (state.ep || 0) + ":" + p.id, my = mine[key];
  if (p.kind === "sort") return drawSort(p, key);
  app.innerHTML = `<div class="q">${esc(p.q)}</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">` +
    p.opts.map((o, k) => { let c = "ab"; if (my === k) c += " sel"; if (p.rev && p.ans >= 0){ c += k === p.ans ? " right" : " wrong"; }
      return `<button class="${c}" data-k="${k}"><span class="L">${L[k]}</span><span>${esc(o)}</span></button>`; }).join("") + `</div>` +
    (my != null ? `<p class="ok" style="margin-top:14px">Vote sent: ${L[my]}. You can change it until the answer is revealed.</p>` : "") +
    (p.rev && p.ans >= 0 ? `<p class="note" style="margin-top:6px">Answer: <b>${L[p.ans]}</b></p>` : "");
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => vote(+b.dataset.k));
}
/* sort game: put each card in one of two places, then send */
let draft = {};
function drawSort(p, key){
  const app = $("#app"), sent = mine[key], d = draft[key] || (draft[key] = Array.isArray(sent) ? sent.slice() : p.items.map(() => -1));
  const done = d.every(x => x === 0 || x === 1), score = p.rev && Array.isArray(sent) ? sent.filter((x, i) => x === p.ans[i]).length : 0;
  app.innerHTML = `<div class="q">${esc(p.q)}</div><p class="note" style="margin:6px 0 0">${p.rev ? "Correct sort below." : "Tap where each case belongs, then press Send."}</p>
  <div class="srt">${p.items.map((it, i) => { const pick = d[i], ok = p.rev && Array.isArray(sent) ? sent[i] === p.ans[i] : null;
    return `<div class="si ${ok === true ? "right" : ok === false ? "wrong" : ""}"><p>${i + 1}. ${esc(it)}</p><div class="bb">${p.bins.map((b, k) => `<button data-i="${i}" data-b="${k}" class="${pick === k ? "on" + k : ""}" ${p.rev ? "disabled" : ""}>${esc(b)}</button>`).join("")}</div>${p.rev ? `<div class="res">${ok === true ? "✓ " : ok === false ? "✗ " : ""}Answer: <b>${esc(p.bins[p.ans[i]])}</b></div>` : ""}</div>`; }).join("")}</div>
  ${p.rev ? (Array.isArray(sent) ? `<p class="ok" style="margin-top:12px">Your score: ${score} / ${p.items.length}</p>` : "") : `<button class="send" id="srtSend" ${done ? "" : "disabled"} style="margin-top:12px">${Array.isArray(sent) ? "Update my answers" : "Send · إرسال"} (${d.filter(x => x >= 0).length}/${p.items.length})</button>${Array.isArray(sent) ? '<p class="ok" style="margin-top:8px">Sent ✓ You can change it until the answer is revealed.</p>' : ""}`}`;
  app.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { if (p.rev) return; d[+b.dataset.i] = +b.dataset.b; drawSort(p, key); });
  const s = $("#srtSend"); if (s) s.onclick = () => sendSort(p, key, d.slice());
}
async function sendSort(p, key, arr){
  if (!state || !state.poll || state.poll.rev) return;
  mine[key] = arr; try { localStorage.setItem("bts.mine", JSON.stringify(mine)); } catch (e) {}
  draw();
  const body = JSON.stringify({id: p.id, s: arr, u: cid, ep: state.ep || 0});
  for (let i = 0; i < 4; i++){
    try { const r = await fetch(BASE + TOPIC + "-v", {method: "POST", body}); if (r.ok) return; } catch (e) {}
    await new Promise(r => setTimeout(r, 1500 * (i + 1)));
  }
  setLive(false, "Could not send. Check your connection and tap again.");
}
async function vote(k){
  if (!state || !state.poll || state.poll.rev) return;
  const p = state.poll, key = (state.ep || 0) + ":" + p.id;
  mine[key] = k; try { localStorage.setItem("bts.mine", JSON.stringify(mine)); } catch (e) {}
  draw();
  const body = JSON.stringify({id: p.id, c: k, u: cid, ep: state.ep || 0});
  for (let i = 0; i < 4; i++){
    try { const r = await fetch(BASE + TOPIC + "-v", {method: "POST", body}); if (r.ok) return; } catch (e) {}
    await new Promise(r => setTimeout(r, 1500 * (i + 1)));
  }
  setLive(false, "Could not send. Check your connection and tap again.");
}
function take(msg){ try { const d = JSON.parse(msg); if (d && d.t === "state" && (!state || (d.ts || 0) >= (state.ts || 0))){ state = d; draw(); } } catch (e) {} }
async function latest(){
  try { const r = await fetch(BASE + TOPIC + "-s/json?poll=1&since=6h"); const t = await r.text();
    t.trim().split("\n").filter(Boolean).forEach(l => { try { const m = JSON.parse(l); if (m.event === "message") take(m.message); } catch (e) {} }); } catch (e) {}
}
function listen(){
  const es = new EventSource(BASE + TOPIC + "-s/sse");
  es.onopen = () => setLive(true, "Connected to the lecture");
  es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === "message") take(m.message); } catch (x) {} };
  es.onerror = () => setLive(false, "Reconnecting…");
}
/* audience questions */
let qLast = 0;
try { $("#qName").value = localStorage.getItem("bts.qname") || ""; } catch (e) {}
$("#qTxt").oninput = () => $("#qN").textContent = $("#qTxt").value.length;
$("#qSend").onclick = async () => {
  const q = $("#qTxt").value.trim(), n = $("#qName").value.trim().slice(0, 40), msg = $("#qMsg"), b = $("#qSend");
  if (q.length < 3){ msg.textContent = "Write your question first · اكتب السؤال الأول"; return; }
  const wait = 20 - Math.floor((Date.now() - qLast) / 1000);
  if (wait > 0){ msg.textContent = "Please wait " + wait + " s before the next question."; return; }
  try { localStorage.setItem("bts.qname", n); } catch (e) {}
  b.disabled = true; msg.textContent = "Sending…";
  const body = JSON.stringify({t:"q", q: q.slice(0, 280), n, u: cid, ts: Date.now()});
  for (let i = 0; i < 4; i++){
    try { const r = await fetch(BASE + TOPIC + "-q", {method: "POST", body}); if (r.ok){ qLast = Date.now(); $("#qTxt").value = ""; $("#qN").textContent = "0"; msg.innerHTML = '<span class="ok">Question sent ✓ · تم الإرسال</span>'; b.disabled = false; return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 1500 * (i + 1)));
  }
  b.disabled = false; msg.textContent = "Could not send. Check your connection and try again.";
};
latest().then(() => { draw(); listen(); });
</script>
</body>
</html>
